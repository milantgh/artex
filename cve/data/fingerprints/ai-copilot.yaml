id: ai-copilot
name: AI Copilot
category: ai-infra
description: AI Copilot is a WordPress plugin by QuadLayers that provides AI-driven chatbot, content generation, and MCP tool capabilities. It integrates with OpenAI GPT models for automated content creation, SEO improvement, and editor utilities, and exposes privileged MCP tools for AI assistant interactions via OAuth-authenticated REST API endpoints.
match:
  any:
  - method: GET
    path: /
    body_regex: (?is)^(?=.*aicp__chatbot)(?=.*aicp__app)
version:
  method: GET
  path: /wp-content/plugins/ai-copilot/readme.txt
  body_regex: Stable tag:\s*([0-9][0-9.]*)
