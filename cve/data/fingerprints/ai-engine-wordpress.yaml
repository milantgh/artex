id: ai-engine-wordpress
name: ai-engine-wordpress
category: ai-infra
description: AI Engine – The Chatbot, AI Framework & MCP for WordPress is a WordPress plugin by Jordy Meow (meow-apps) that connects WordPress to major AI providers (OpenAI, Anthropic, Google, Mistral) for chatbots, content generation, AI forms, an AI Workspace in wp-admin, and a built-in OAuth-enabled MCP server. Detected via the plugin's readme.txt and mwai-prefixed front-end chatbot assets.
match:
  any:
  - method: GET
    path: /wp-content/plugins/ai-engine/readme.txt
    body_regex: (?is)^(?=.*===\ AI\ Engine)(?=.*Contributors:\ TigrouMeow)
version:
  method: GET
  path: /wp-content/plugins/ai-engine/readme.txt
  body_regex: Stable tag:\s*([0-9][0-9.]*)
