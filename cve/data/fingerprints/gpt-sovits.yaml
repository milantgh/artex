id: gpt-sovits
name: gpt-sovits
category: ai-infra
description: GPT-SoVITS 是一款开源的语音合成与语音转换项目，支持少样本语音克隆，提供基于 Gradio 的 WebUI 界面。
match:
  any:
  - method: GET
    path: /
    body_regex: (?is)^(?=.*GPT\-SoVITS\ WebUI)(?=.*gradio)
  - method: GET
    path: /config
    body_regex: (?is)"title":"GPT\-SoVITS\ WebUI"
version:
  method: GET
  path: /
  body_regex: GPT-SoVITS[_\s]+v?(\d{8}v?\d*(?:pro)?)
