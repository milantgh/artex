id: lightrag
name: LightRAG
category: ai-infra
description: LightRAG是一个简单快速的检索增强生成(RAG)框架，提供FastAPI REST API服务，支持文档管理、查询和图操作。
match:
  any:
  - method: GET
    path: /health
    body_regex: (?is)^(?=.*"core_version")(?=.*"api_version")(?=.*"auth_mode")
  - method: GET
    path: /openapi.json
    body_regex: (?is)"LightRAG\ Server\ API"
version:
  method: GET
  path: /health
  body_regex: '"core_version":"([0-9]+\.[0-9]+\.[0-9]+[^"]*)"'
