id: llmstudio
name: llmstudio
category: ai-infra
description: H2O.ai提供的框架和无代码GUI，用于微调大型语言模型。
match:
  any:
  - method: GET
    path: /zuqu3
    body_regex: (?is)Unexpected\ endpoint\ or\ method\.\ \(GET\ /zuqu3\)
    header_regex:
      '*': (?is)x\-powered\-by:\ Express
version:
  method: GET
  path: /
  body_regex: v(\d+\.\d+\.?\d*)
