id: milvus
name: Milvus
category: ai-infra
description: Milvus is an open-source vector database built for AI and LLM applications, providing scalable similarity search. It exposes a management/metrics HTTP server on port 9091 with a built-in WebUI.
match:
  any:
  - method: GET
    path: /webui/
    body_regex: (?is)^(?=.*<title>Milvus\ Management</title>)(?=.*milvus\-logo)
