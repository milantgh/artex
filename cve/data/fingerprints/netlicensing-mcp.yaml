id: netlicensing-mcp
name: netlicensing-mcp
category: ai-infra
description: NetLicensing-MCP is an official MCP (Model Context Protocol) server from Labs64 that enables AI agents to manage software licensing lifecycle via the NetLicensing REST API. It exposes an unauthenticated health endpoint and a Streamable HTTP MCP endpoint.
match:
  any:
  - method: GET
    path: /health
    body_regex: (?is)^(?=.*"server":"netlicensing\-mcp")(?=.*"status":"ok")
  - method: POST
    path: /mcp
    body_regex: (?is)"netlicensing\-mcp"
