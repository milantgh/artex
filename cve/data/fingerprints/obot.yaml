id: obot
name: Obot
category: ai-infra
description: Obot (obot-platform/obot) is an open-source AI agent/MCP platform. The Go server (default port 8080) serves a SvelteKit UI at / and a REST API under /api. The Docker quickstart historically ran with authentication disabled, mapping every request to a synthetic "nobody" user holding Owner/Admin roles.
match:
  any:
  - method: GET
    path: /
    body_regex: (?is)<title>Obot\ \-\ Build\ AI\ agents\ with\ MCP</title>
  - method: GET
    path: /api/version
    body_regex: (?is)^(?=.*"obot")(?=.*"authEnabled")
version:
  method: GET
  path: /api/version
  body_regex: '"obot"\s*:\s*"([^"]+)"'
