id: openwebui
name: openwebui
category: ai-infra
description: 一个开源、自托管的AI平台，提供用户友好的本地运行大语言模型的界面，支持Ollama等运行器。
match:
  any:
  - method: GET
    path: /
    body_regex: (?is)title="Open\ WebUI"
  - method: GET
    path: /api/config
    body_regex: (?is)^(?=.*"name":"Open\ WebUI")(?=.*"features":)
version:
  method: GET
  path: /api/version
  body_regex: '{"version":"(\d+\.\d+\.?\d+?)"'
