id: ruflo
name: ruflo
category: ai-infra
description: Ruflo is an agent meta-harness for Claude Code and Codex, providing multi-agent orchestration via MCP bridge and RuVocal Chat UI (SvelteKit) in docker-compose deployment
match:
  any:
  - method: GET
    path: /
    body_regex: (?is)^(?=.*RuVocal)(?=.*ruflo)
version:
  method: GET
  path: /health
  body_regex: '"version":"([0-9][0-9.a-zA-Z\-]+)"'
