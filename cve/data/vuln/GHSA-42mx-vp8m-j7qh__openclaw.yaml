id: GHSA-42mx-vp8m-j7qh
title: OpenClaw OpenShell `mirror` 模式可将不可信沙箱文件转换为已启用的工作区钩子，并在 Gateway 启动时于宿主机上执行
component: openclaw
severity: MEDIUM
affected: <=2026.3.24
description: "漏洞概述\nOpenShell mirror 模式可将不可信沙箱文件转换为已显式启用的工作区钩子， 并在 Gateway 启动时于宿主机上执行\n\n维护者评估\n- 状态：有限范围\n- 标准化严重等级：中危\n- 评估：在已发布的 <=2026.3.22 版本 OpenShell mirror 同步中确认存在，\n  但漏洞利用需同时满足：启用 mirror 模式、启用钩子功能、显式选择钩子、以及重启等多个前提条件，\n  即使直接修复已随 v2026.3.28 发布，高危评级仍属高估。\n\n\n受影响的软件包及版本\n- 软件包：openclaw（npm）\n- 最新发布的 npm 版本：2026.3.31\n- 受影响版本范围：<=2026.3.24\n- 已修复版本：>= 2026.3.28\n- 包含修复的首个稳定标签：v2026.3.28"
references:
- https://github.com/openclaw/openclaw/security/advisories/GHSA-42mx-vp8m-j7qh
remediation: 将 openclaw 升级至 >= 2026.3.28 或更高版本。相关提交 - c02ee8a3a4cb390b23afdf21317aa8b2096854d1 — 2026-03-25T19:59:07Z
