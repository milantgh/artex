# ============================================================
# CVE 规则模板 —— 复制本文件，改名为 <CVE-ID>.yaml 放入本目录即可
# 注意：文件名不要以 "_" 开头（"_" 开头的文件会被扫描器忽略）
# 校验：aisec vuln validate
# ============================================================
id: CVE-XXXX-YYYYY               # 必填，唯一 id
title: "一句话漏洞标题"            # 必填
component: ollama                # 必填，必须是某个指纹的 id（见 data/fingerprints/）
severity: HIGH                   # 必填：CRITICAL / HIGH / MEDIUM / LOW / INFO
affected: ">=0.1.0,<0.1.34"      # 受影响版本区间；"*" 表示全部版本
description: "漏洞原理一句话说明"
references:
  - https://nvd.nist.gov/vuln/detail/CVE-XXXX-YYYYY
remediation: "升级到 x.y.z 或更高版本"
owasp_tags: [LLM05]              # 可选，OWASP LLM Top10 标签

# check —— 可选，默认 version 模式。
#   mode: version  仅凭指纹识别出的版本落入 affected 区间即告警（被动、零风险，默认）
#   mode: request  额外发一个确认请求，需命令行加 --active 才会执行
check:
  mode: version
  # mode: request
  # method: POST
  # path: /api/xxx
  # headers:
  #   Content-Type: application/json
  # body: '{"key":"value"}'
  # match:                       # request 模式下判定“漏洞存在”的响应条件
  #   status: [200]
  #   body_contains: "..."
  #   body_regex: "..."
